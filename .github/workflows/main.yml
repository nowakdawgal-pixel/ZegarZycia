
name: Zegar Zycia - Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj aplikacje Android
        run: gradle assembleDebug

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Zegar-Zycia-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
